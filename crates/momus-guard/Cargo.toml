[package]
name = "momus-guard"
version = "0.1.0"
edition = "2024"
description = "Security scanning — check for missing auth, CORS misconfig, info leaks, exposed endpoints"
license = "Apache-2.0"
repository = "https://github.com/jlcoulter/momus"
homepage = "https://github.com/jlcoulter/momus"
documentation = "https://github.com/jlcoulter/momus#readme"
keywords = ["testing", "api", "http", "security", "scanning"]
categories = ["development-tools::testing", "web-programming::http-client"]

[dependencies]
momus-core = { version = "0.1", path = "../momus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
