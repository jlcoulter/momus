[package]
name = "momus-cli"
version.workspace = true
edition = "2024"
description = "Momus API test harness — CLI runner"
license = "Apache-2.0"
repository = "https://github.com/jlcoulter/momus"
homepage = "https://github.com/jlcoulter/momus"
documentation = "https://github.com/jlcoulter/momus#readme"
readme = "README.md"
keywords = ["testing", "api", "http", "assertions", "jsonpath"]
categories = ["development-tools::testing", "web-programming::http-client"]

[[bin]]
name = "momus"
path = "src/main.rs"

[dependencies]
momus-core = { path = "../momus-core", version = "0.4.0" }
momus-mock = { path = "../momus-mock", version = "0.4.0" }
momus-convert = { path = "../momus-convert", version = "0.4.0", features = [
    "openapi", "postman", "har", "curl", "graphql", "grpc", "fhir",
] }
momus-bench = { path = "../momus-bench", version = "0.4.0" }
momus-fuzz = { path = "../momus-fuzz", version = "0.4.0" }
momus-chaos = { path = "../momus-chaos", version = "0.4.0" }
momus-contract = { path = "../momus-contract", version = "0.4.0" }
momus-guard = { path = "../momus-guard", version = "0.4.0" }
momus-diff = { path = "../momus-diff", version = "0.4.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
dirs = "6"

[dev-dependencies]
cargo-husky.workspace = true
