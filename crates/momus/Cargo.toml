[package]
name = "momus"
version.workspace = true
edition = "2024"
description = "Generic API test harness with a composable assertion AST (umbrella crate)"
license = "Apache-2.0"
repository = "https://github.com/jlcoulter/momus"
homepage = "https://github.com/jlcoulter/momus"
documentation = "https://github.com/jlcoulter/momus#readme"
readme = "README.md"
keywords = ["testing", "api", "http", "assertions", "jsonpath"]
categories = ["development-tools::testing", "web-programming::http-client"]

[dependencies]
momus-core = { path = "../momus-core", version = "0.7.6" }
momus-mock = { path = "../momus-mock", version = "0.7.6" }
momus-convert = { path = "../momus-convert", version = "0.7.6" }
momus-bench = { path = "../momus-bench", version = "0.7.6" }
momus-fuzz = { path = "../momus-fuzz", version = "0.7.6" }
momus-chaos = { path = "../momus-chaos", version = "0.7.6" }
momus-contract = { path = "../momus-contract", version = "0.7.6" }
momus-guard = { path = "../momus-guard", version = "0.7.6" }
momus-diff = { path = "../momus-diff", version = "0.7.6" }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
cargo-husky.workspace = true
