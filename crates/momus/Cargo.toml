[package]
name = "momus"
version = "0.1.0"
edition = "2024"
description = "Generic API test harness with a composable assertion AST (umbrella crate)"
license = "Apache-2.0"
repository = "https://github.com/jlcoulter/momus"
homepage = "https://github.com/jlcoulter/momus"
documentation = "https://github.com/jlcoulter/momus#readme"
keywords = ["testing", "api", "http", "assertions", "jsonpath"]
categories = ["development-tools::testing", "web-programming::http-client"]

[dependencies]
momus-core = { version = "0.1", path = "../momus-core" }
momus-mock = { version = "0.1", path = "../momus-mock" }
momus-convert = { version = "0.1", path = "../momus-convert" }
momus-bench = { version = "0.1", path = "../momus-bench" }
momus-fuzz = { version = "0.1", path = "../momus-fuzz" }
momus-chaos = { version = "0.1", path = "../momus-chaos" }
momus-contract = { version = "0.1", path = "../momus-contract" }
momus-guard = { version = "0.1", path = "../momus-guard" }
momus-diff = { version = "0.1", path = "../momus-diff" }
serde_json = "1"
anyhow = "1"
