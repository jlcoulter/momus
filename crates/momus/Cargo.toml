[package]
name = "momus"
version.workspace = true
edition = "2024"
description = "Generic API test harness with a composable assertion AST (umbrella crate)"
license = "Apache-2.0"
repository = "https://github.com/jlcoulter/momus"
homepage = "https://github.com/jlcoulter/momus"
documentation = "https://github.com/jlcoulter/momus#readme"
readme = "README.md"
keywords = ["testing", "api", "http", "assertions", "jsonpath"]
categories = ["development-tools::testing", "web-programming::http-client"]

[dependencies]
momus-core = { path = "../momus-core" }
momus-mock = { path = "../momus-mock" }
momus-convert = { path = "../momus-convert" }
momus-bench = { path = "../momus-bench" }
momus-fuzz = { path = "../momus-fuzz" }
momus-chaos = { path = "../momus-chaos" }
momus-contract = { path = "../momus-contract" }
momus-guard = { path = "../momus-guard" }
momus-diff = { path = "../momus-diff" }
serde_json = "1"
anyhow = "1"
