[package]
name = "momus-convert"
version.workspace = true
edition = "2024"
description = "Convert API descriptions (OpenAPI, Postman, HAR, cURL, GraphQL, gRPC, FHIR) into Momus test plans"
license = "Apache-2.0"
repository = "https://github.com/jlcoulter/momus"
homepage = "https://github.com/jlcoulter/momus"
documentation = "https://github.com/jlcoulter/momus#readme"
readme = "README.md"
keywords = ["testing", "api", "openapi", "postman", "graphql"]
categories = ["development-tools::testing", "web-programming::http-client"]

[dependencies]
momus-core = { path = "../momus-core", version = "0.7.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
flate2 = "1"
tar = "0.4"
openapiv3 = "2.2"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
cargo-husky.workspace = true
tempfile = "3"
insta = { version = "1", features = ["json"] }

[features]
default = ["openapi", "postman", "har", "curl"]
openapi = []
postman = []
har = []
curl = []
graphql = []
grpc = []
fhir = []
