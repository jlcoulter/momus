[package]
name = "momus-fuzz"
version.workspace = true
edition = "2024"
description = "Payload mutation engine — boundary, encoding, type mismatch, cardinality mutators"
license = "Apache-2.0"
repository = "https://github.com/jlcoulter/momus"
homepage = "https://github.com/jlcoulter/momus"
documentation = "https://github.com/jlcoulter/momus#readme"
readme = "README.md"
keywords = ["testing", "api", "http", "fuzzing", "mutation"]
categories = ["development-tools::testing", "web-programming::http-client"]

[dependencies]
momus-core = { path = "../momus-core", version = "0.3.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
