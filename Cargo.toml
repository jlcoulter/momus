[workspace]
resolver = "2"
members = ["."]

[package]
name = "momus"
version = "0.1.0"
edition = "2024"
description = "Generic API test harness with a composable assertion AST"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = "2"
toml = "0.8"
regex = "1"
jsonpath-rust = "0.7"
futures = "0.3"
http-body-util = "0.1"
bytes = "1"
