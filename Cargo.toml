[workspace]
resolver = "2"
members = [
    "crates/momus-core",
    "crates/momus-mock",
    "crates/momus-convert",
    "crates/momus-bench",
    "crates/momus-fuzz",
    "crates/momus-chaos",
    "crates/momus-contract",
    "crates/momus-guard",
    "crates/momus-diff",
    "crates/momus-cli",
    "crates/momus",
]

[workspace.package]
version = "0.7.18"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jlcoulter/momus"
homepage = "https://github.com/jlcoulter/momus"
documentation = "https://github.com/jlcoulter/momus#readme"

[workspace.dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = [
    "precommit-hook",
    "prepush-hook",
] }
