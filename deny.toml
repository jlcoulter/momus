[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "MIT-0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.92

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
skip = [
    # getrandom: 0.2.x used by ring/const-random, 0.3.x used by ahash/rand, 0.4.x used by jobserver/cc
    "getrandom@0.2.17",
    "getrandom@0.3.4",
    "getrandom@0.4.3",
    # r-efi: 5.x and 6.x pulled in by different getrandom versions
    "r-efi@5.3.0",
    "r-efi@6.0.0",
    # reqwest: 0.12.x used by workspace crates, 0.13.x used by jsonschema
    "reqwest@0.12.28",
    "reqwest@0.13.4",
    # syn: 2.x used by most proc macros, 3.x used by async-trait and clap_derive
    "syn@2.0.119",
    "syn@3.0.3",
    # windows-sys: 0.52.x used by ring, 0.61.x used by anstyle/tokio
    "windows-sys@0.52.0",
    "windows-sys@0.61.2",
]
skip-tree = []
