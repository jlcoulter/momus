# HAPI FHIR JPA server backed by PostgreSQL.
#
# Purpose: give Momus a target FHIR server with REAL persistent storage so
# setup resources (e.g. Location/momus-setup-location) survive across requests.
# An in-memory / storage-less HAPI instance returns "Resource ... not found"
# for references because nothing is persisted, which produces exactly the
# HAPI-1094 fingerprints seen in the run report.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   # wait for HAPI to be ready, then:
#   go run ./cmd/momus coverage run package.tgz \
#     --base-url http://localhost:8080/fhir \
#     --output ./test-results.json
#
# The FHIR base URL is http://localhost:8080/fhir (matches the README examples).

services:
  db:
    image: postgres:16-alpine
    container_name: momus-hapi-db
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    volumes:
      - hapi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  hapi:
    image: hapiproject/hapi:v7.4.0
    container_name: momus-hapi
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- Database (Postgres sidecar) ---
      DB_URL: jdbc:postgresql://db:5432/hapi
      DB_USERNAME: hapi
      DB_PASSWORD: hapi
      DB_DRIVER: org.postgresql.Driver
      # --- FHIR version ---
      HAPI_FHIR_VERSION: R4
      # --- Server identity / address ---
      HAPI_FHIR_SERVER_ADDRESS: http://localhost:8080/fhir
      HAPI_FHIR_SERVER_NAME: Momus HAPI FHIR Server
      # --- Storage / persistence (explicitly enabled) ---
      HAPI_FHIR_SERVER_CONF: hapi-fhir-jpaserver
      # Allow create/update via PUT (Momus uses PUT to seed setup resources).
      HAPI_FHIR_ALLOW_EXTERNAL_REFS: "true"
      HAPI_FHIR_DEFAULT_ENCODING: json
      # --- Logging ---
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/fhir/metadata >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  hapi-db-data:
