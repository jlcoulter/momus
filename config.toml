# Momus Configuration
#
# This is the global config file for momus. It is auto-discovered from:
#   1. --config <path> (explicit)
#   2. $MOMUS_CONFIG (env var)
#   3. ./momus.toml
#   4. ./.momus.toml
#   5. ~/.config/momus/config.toml
#
# CLI flags override these values.
#
# Usage:
#   momus run plan.json
#   momus --config config.toml run plan.json
#   MOMUS_CONFIG=config.toml momus run plan.json
#
# Each crate's settings live in its own TOML section. The [global]
# section provides defaults inherited by all commands unless a
# command-specific section overrides them.

# ---------------------------------------------------------------------------
# Global defaults — inherited by all commands
# ---------------------------------------------------------------------------
[global]
# Base URL for all requests (overrides the plan's base_url).
# base_url = "http://localhost:8080"

# Default headers sent with every request.
# [global.headers]
# Authorization = "Bearer your-token-here"
# Accept = "application/json"

# Request timeout in seconds (default: 30).
# timeout_secs = 60

# ---------------------------------------------------------------------------
# Run / Validate
# ---------------------------------------------------------------------------
[run]
# Output directory for results (default: ./output).
# output = "./results"

# ---------------------------------------------------------------------------
# Bench — load testing
# ---------------------------------------------------------------------------
[bench]
# Output directory for results (default: ./output).
# output = "./bench-results"

# Execution mode: Steady, MaxThroughput, or Soak.
# [bench.mode]
# type = "Steady"
# concurrency = 20
# duration_secs = 60

# Number of warmup requests before recording (default: 0).
# warmup_requests = 10

# ---------------------------------------------------------------------------
# Fuzz — payload mutation
# ---------------------------------------------------------------------------
[fuzz]
# Output directory for results (default: ./output).
# output = "./fuzz-results"

# Number of mutations to generate per input (default: 1000).
# iterations = 5000

# Which mutators to apply (empty = all).
# mutators = ["boundary", "encoding", "type_mismatch"]

# ---------------------------------------------------------------------------
# Chaos — fault injection
# ---------------------------------------------------------------------------
[chaos]
# Output directory for results (default: ./output).
# output = "./chaos-results"

# How long to wait between experiments in seconds (default: 5).
# interval_secs = 10

# List of experiments to run.
# [[chaos.experiments]]
# type = "NetworkLatency"
# endpoint = "/api/slow"
# delay_ms = 500
# duration_secs = 30

# ---------------------------------------------------------------------------
# Contract — spec validation
# ---------------------------------------------------------------------------
[contract]
# Output directory for results (default: ./output).
# output = "./contract-results"

# Path to the API spec file (OpenAPI YAML/JSON or GraphQL SDL).
# spec_path = "./api-spec.yaml"

# Fail on undocumented endpoints (default: false).
# strict = true

# ---------------------------------------------------------------------------
# Guard — security scanning
# ---------------------------------------------------------------------------
[guard]
# Output directory for results (default: ./output).
# output = "./guard-results"

# Check for missing security headers (default: true).
# check_headers = true
# check_cors = true
# check_leaks = true
# check_exposed = true

# ---------------------------------------------------------------------------
# Plan — plan display
# ---------------------------------------------------------------------------
[plan]
# Output directory for the plan display (default: ./output).
# output = "./plan-output"

# ---------------------------------------------------------------------------
# Diff — regression testing
# ---------------------------------------------------------------------------
[diff]
# Output directory for results (default: ./output).
# output = "./diff-results"

# Baseline environment URL (e.g. production).
# baseline_url = "https://prod.example.com"

# Target environment URL (e.g. staging).
# target_url = "https://staging.example.com"

# Diff response headers (default: true).
# diff_headers = true
# diff_bodies = true
# diff_status = true
